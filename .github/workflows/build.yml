
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quebra cabeça.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Compilar aplicativo
        run: |
          unzip "quebra cabeça.zip" -d projeto
          gradle -p projeto/QuebraCabeca assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: QuebraCabeca-APK
          path: projeto/QuebraCabeca/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK
        run: cp projeto/QuebraCabeca/app/build/outputs/apk/debug/app-debug.apk QuebraCabeca.apk

      - name: Apagar versões anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName -q '.[].tagName'); do
            gh release delete "$t" --cleanup-tag -y
          done

      - name: Publicar APK (substitui o anterior)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Quebra-Cabeça
          body: ""
          make_latest: true
          files: QuebraCabeca.apk
