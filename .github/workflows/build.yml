
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quebra cabeça.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Compilar aplicativo
        run: |
          unzip "quebra cabeça.zip" -d projeto
          gradle -p projeto/QuebraCabeca assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: QuebraCabeca-APK
          path: projeto/QuebraCabeca/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar versão (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Quebra-Cabeça v${{ github.run_number }}
          body: APK de debug gerado automaticamente. Baixe o app-debug.apk abaixo e instale no celular.
          files: projeto/QuebraCabeca/app/build/outputs/apk/debug/app-debug.apk
