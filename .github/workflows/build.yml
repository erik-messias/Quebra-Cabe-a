
name: Compilar APK e Windows

on:
  workflow_dispatch:
  push:
    branches: [main, teste]
    paths:
      - "quebra cabeça.zip"
      - "pc/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Compilar aplicativo
        run: |
          unzip "quebra cabeça.zip" -d projeto
          gradle -p projeto/QuebraCabeca assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: QuebraCabeca-APK
          path: projeto/QuebraCabeca/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilar programa Windows
        working-directory: pc
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: QuebraCabeca-Windows
          path: pc/dist/QuebraCabeca-Windows.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuebraCabeca-APK
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: QuebraCabeca-Windows
          path: out
      - name: Preparar arquivos
        run: mv out/app-debug.apk out/QuebraCabeca.apk && mkdir site && cp pc/index.html site/QuebraCabeca-Navegador.html && cp site/QuebraCabeca-Navegador.html out/
      - name: Apagar versões anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName -q '.[].tagName'); do
            gh release delete "$t" --cleanup-tag -y
          done
      - name: Publicar (substitui o anterior)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Quebra-Cabeça
          body: ""
          make_latest: true
          files: |
            out/QuebraCabeca.apk
            out/QuebraCabeca-Windows.exe
            out/QuebraCabeca-Navegador.html
